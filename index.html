<style>
:root {
  --fundo: #161616; --area: #232323; --painel: #2a2a2a; --painel-2: #303030; --cab: #1e1e1e; --barra: #1b1b1b;
  --campo: #474747; --campo-h: #565656; --hover: #ffffff10; --borda: #0e0e0e; --linha: #343434;
  --texto: #e3e3e3; --fraco: #8d8d8d; --azul: #4772b3; --azul-claro: #5d8be0; --sel: #334a6e; --aviso: #c5953f;
  --ok: #4ec94e; --erro: #d24c4c; --destaque: #f0b45a;
  --eixo-x: #c75454; --eixo-y: #74b34e; --eixo-z: #4f7fd1;
  --raio: 5px; --raio-p: 3px; --esp: 6px; --esp-2: 10px;
  --h-topo: 38px; --h-aba: 28px; --w-ferr: 44px; --div: 5px;
  --w-dir: 304px; --h-out: 192px; --h-baixo: 144px;
  /* Escala da interface (0.8 = o tamanho que fica bom num monitor 2560px com zoom 100%). Só os conteúdos das áreas
     recebem zoom; o viewport WebGL (#cv/#cv2) e os contêineres arrastáveis ficam em px reais, sem distorcer o mouse. */
  --ui: 0.8;
  --fonte: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--fundo); color: var(--texto); font: 12px/1.35 var(--fonte); overflow: hidden;
  display: flex; flex-direction: column; }
button { font: inherit; color: inherit; }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round;
  stroke-linejoin: round; }

/* ---------- barra superior */
#topo { height: var(--h-topo); flex: none; display: flex; align-items: center; gap: var(--esp); padding: 0 var(--esp-2);
  background: var(--barra); border-bottom: 1px solid var(--borda); }
#marca { display: flex; align-items: center; gap: 7px; font-weight: 700; letter-spacing: .2px; margin-right: 6px; white-space: nowrap; }
#marca i { width: 14px; height: 14px; border-radius: 3px; background: linear-gradient(135deg, #f6c56b, #c9832e);
  box-shadow: 0 0 8px #f0b45a55; transform: rotate(45deg) scale(.8); }
.menu { background: none; border: 0; padding: 0 9px; height: 26px; border-radius: var(--raio-p); color: var(--fraco); cursor: not-allowed; }
.menu:hover { background: var(--hover); }
.menu-caixa { position: relative; flex: none; }
.menu.vivo { color: var(--texto); cursor: pointer; }
.menu.vivo[aria-expanded="true"] { background: var(--sel); }
.menu-lista { position: absolute; top: calc(100% + 3px); left: 0; z-index: 50; min-width: 190px; display: flex; flex-direction: column;
  background: #232323; border: 1px solid var(--borda); border-radius: var(--raio); padding: 3px; box-shadow: 0 6px 16px #0009; }
.menu-lista[hidden] { display: none; }
.menu-lista button { background: none; border: 0; color: var(--texto); text-align: left; height: 24px; padding: 0 8px; display: flex;
  align-items: center; justify-content: space-between; gap: 16px; border-radius: var(--raio-p); cursor: pointer; font: inherit; }
.menu-lista button:hover:not(:disabled), .menu-lista button:focus-visible { background: var(--sel); outline: none; }
.menu-lista button:disabled { color: var(--fraco); cursor: not-allowed; }
.menu-lista kbd { font: 11px var(--fonte); color: var(--fraco); }
.menu-lista hr { border: 0; border-top: 1px solid var(--linha); margin: 3px 2px; }
.sep { width: 1px; height: 18px; background: var(--linha); margin: 0 4px; flex: none; }
.ctrl { background: var(--painel-2); border: 1px solid var(--borda); border-radius: var(--raio); height: 26px; color: var(--texto);
  font: inherit; padding: 0 8px; }
select.ctrl { width: auto; height: 26px; padding: 0 4px; }
.ibtn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; background: var(--painel-2);
  border: 1px solid var(--borda); border-radius: var(--raio); height: 26px; min-width: 28px; padding: 0 7px; cursor: pointer; }
.ibtn:hover:not(:disabled) { background: #3a3a3a; }
.ibtn:disabled { opacity: .4; cursor: not-allowed; }
#play { color: #7fd17f; }
#meio-topo { flex: 1; display: flex; justify-content: center; }
#sub { color: var(--fraco); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#conexao { display: flex; align-items: center; gap: 6px; color: var(--fraco); white-space: nowrap; }
#luz { width: 9px; height: 9px; border-radius: 50%; background: #666; flex: none; }
#luz.on { background: var(--erro); box-shadow: 0 0 6px var(--erro); }
#luz.on.ok { background: var(--ok); box-shadow: 0 0 6px var(--ok); }

/* ---------- abas das áreas (só em tela estreita) */
#abas-areas { display: none; flex: none; background: var(--barra); border-bottom: 1px solid var(--borda); }
#abas-areas button { flex: 1; background: none; border: 0; height: 32px; color: var(--fraco); cursor: pointer; border-bottom: 2px solid transparent; }
#abas-areas button.ativa { color: var(--texto); border-bottom-color: var(--azul-claro); }

/* ---------- corpo */
#corpo { flex: 1; min-height: 0; display: flex; }
#ferramentas { width: var(--w-ferr); flex: none; background: var(--barra); border-right: 1px solid var(--borda);
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 8px; }
.ferr { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: var(--raio);
  background: none; color: var(--fraco); cursor: pointer; }
.ferr:hover { background: var(--hover); color: var(--texto); }
.ferr.ativa { background: var(--azul); color: #fff; box-shadow: 0 1px 4px #0006; }
.ferr svg.ic { width: 18px; height: 18px; }
#centro { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#direita { width: var(--w-dir); flex: none; display: flex; flex-direction: column; min-width: 0; }

.area { background: var(--area); display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.area-cab { height: var(--h-aba); flex: none; display: flex; align-items: center; gap: var(--esp); padding: 0 8px;
  background: var(--cab); border-bottom: 1px solid var(--borda); color: var(--fraco); }
.area-cab .tit { font-weight: 600; color: var(--texto); display: flex; align-items: center; gap: 6px; }

/* divisórias */
.div { flex: none; background: var(--borda); position: relative; touch-action: none; z-index: 2; }
.div::after { content: ''; position: absolute; inset: 0; background: var(--azul-claro); opacity: 0; transition: opacity .12s; }
.div:hover::after, .div.arrastando::after { opacity: .7; }
.div.v { width: var(--div); cursor: col-resize; }
.div.h { height: var(--div); cursor: row-resize; }
body.arrastando, body.arrastando * { user-select: none !important; }
body.arrastando canvas { pointer-events: none; }

/* viewport */
#vista { flex: 1; position: relative; min-height: 80px; background: linear-gradient(#4b4b4b, #2f2f2f); }
#vista canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
#vista #cv2 { pointer-events: none; }
#semgl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center;
  color: var(--aviso); font-size: 14px; }
#vista-cab { position: absolute; left: 0; top: 0; z-index: 5; height: 26px; display: flex; gap: 2px; padding: 0 4px; align-items: center; background: #0006; border-radius: 0 0 var(--raio) 0; }
#sombra { display: flex; gap: 1px; margin-left: 6px; }
#sombra button[aria-pressed="true"] { background: var(--sel); }
#vista-cab .menu-lista { z-index: 60; }
#modo-obj, #em-sel { display: flex; gap: 1px; margin-left: 6px; }
#em-sel { display: none; }
.em-b { color: var(--texto); cursor: pointer; }
.em-b[aria-pressed="true"] { background: var(--sel); }
#hud { position: absolute; left: 10px; top: 34px; color: #ddd; pointer-events: none; white-space: pre; font: 11px var(--mono);
  text-shadow: 0 1px 2px #000; }
#dica-ferr { position: absolute; right: 10px; top: 34px; background: #000a; border-radius: var(--raio); padding: 3px 8px;
  color: var(--texto); pointer-events: none; }

/* área de baixo */
#baixo { height: var(--h-baixo); flex: none; }
body.baixo-fechado #baixo { height: calc(var(--h-aba) * var(--ui)) !important; }
#topo, #vista-cab, #abas-areas, #ferramentas, #hud, #dica-ferr, .area-cab, #arvore, #props-corpo, .conteudo-baixo { zoom: var(--ui); }
body.baixo-fechado #div-baixo { display: none; }
.abas-area { display: flex; gap: 2px; align-self: stretch; align-items: flex-end; }
.abas-area button { background: none; border: 0; padding: 0 10px; height: 24px; border-radius: var(--raio) var(--raio) 0 0;
  color: var(--fraco); cursor: pointer; }
.abas-area button:hover { color: var(--texto); }
.abas-area button.ativa { background: var(--area); color: var(--texto); }

<script>
// Widgets dos templates do layout falso (tools/editor_web/layout_espiao.py na engine).
//
// Funções puras: recebem o nó JSON e `enviar(cmd)`, devolvem um HTMLElement.
// `cmd` segue o protocolo da ponte (ponte.py):
//   {cmd:'escrever', rna, valor, indice:null}   -> le.escrever() (POINTER por nome, índice ativo int)
//   {cmd:'operador', op, props:{}}              -> só operadores da lista OPERADORES da ponte
//   {cmd:'novo_bloco', op, rna}                 -> "+" do template_ID: cria e liga ao dono (rna do seletor)
//
// Como integrar em modelo.html:
//   1. <script src="widgets_templates.js"><\/script> antes do script principal.
//   2. No desenho de itens (onde hoje cai em falta()/sem_suporte), antes do fallback:
//        const w = WidgetsTemplates.criar(no, cmd => {
//          if (cmd.cmd === 'escrever') return enviar({ rna: cmd.rna }, cmd.valor, cmd.indice ?? undefined);
//          if (wsAberto()) ponte.ws.send(JSON.stringify(cmd));
//        });
//        if (w) return w;
//   3. 'grid_flow' já chega como container (itens normais), tratar como column_flow.
//   4. Usa as variáveis CSS de modelo.html (--campo, --sel, --azul, --fraco...) e as
//      classes .btn/.texto/.row. O CSS próprio é injetado uma vez (id "wt-css").
(function (global) {
  'use strict';

  const CSS = `
.wt-lista { background: #1f1f1f; border: 1px solid var(--borda, #0e0e0e); border-radius: var(--raio-p, 3px);
  overflow-y: auto; flex: 1; min-width: 0; }
.wt-item { display: flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; cursor: pointer;
  color: var(--texto, #e3e3e3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt-item:hover { background: var(--hover, #ffffff10); }
.wt-item.ativo { background: var(--sel, #334a6e); }
.wt-ico { color: var(--fraco, #8d8d8d); font-size: 10px; }
.wt-vazio { color: var(--fraco, #8d8d8d); padding: 4px 6px; font-style: italic; }
.wt-id { display: flex; gap: 2px; align-items: center; width: 100%; }
.wt-id select { flex: 1; min-width: 0; }
.wt-id .btn { min-width: 22px; padding: 0 6px; }
.wt-prev { height: 120px; border-radius: var(--raio, 5px); background:
  repeating-conic-gradient(#2c2c2c 0 25%, #353535 0 50%) 0 0 / 16px 16px;
  display: flex; align-items: center; justify-content: center; color: var(--fraco, #8d8d8d); }
`;

  function css() {
    if (typeof document === 'undefined' || document.getElementById('wt-css')) return;
    const s = document.createElement('style'); s.id = 'wt-css'; s.textContent = CSS;
    document.head.append(s);
  }

  function el(tag, cls, txt) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  // template_list: {itens_lista:[{nome, icone?, indice}], ativo:{rna, valor}, rna, rows, total}
  function templateList(no, enviar) {
    css();
    const caixa = el('div', 'wt-lista');
    const linhas = Math.max(no.rows || 5, Math.min((no.itens_lista || []).length, 10));
    caixa.style.height = (linhas * 20 + 2) + 'px';
    const itens = no.itens_lista || [];
    if (!itens.length) caixa.append(el('div', 'wt-vazio', '(vazia)'));
    let ativo = no.ativo ? no.ativo.valor : -1;
    for (const it of itens) {
      const linha = el('div', 'wt-item' + (it.indice === ativo ? ' ativo' : ''));
      if (it.icone && it.icone !== 'NONE') linha.append(el('span', 'wt-ico', '●'));
      linha.append(el('span', null, it.nome ?? '#' + it.indice));
      linha.title = it.nome ?? '';
      linha.onclick = () => {
        if (!no.ativo || !no.ativo.rna) return;
        ativo = it.indice;
        caixa.querySelectorAll('.wt-item').forEach(x => x.classList.remove('ativo'));
        linha.classList.add('ativo');
        enviar({ cmd: 'escrever', rna: no.ativo.rna, valor: it.indice, indice: null });
      };
      caixa.append(linha);
    }
    if (no.total > itens.length) caixa.append(el('div', 'wt-vazio', '+' + (no.total - itens.length) + ' itens'));
    return caixa;
  }

  // template_ID: {rna, valor, opcoes, editavel, op_novo, op_abrir, op_desvincular}
  function templateID(no, enviar) {
    css();
    const r = el('div', 'wt-id');
    const s = el('select');
    s.add(new Option('(nenhum)', ''));
    for (const n of no.opcoes || []) {
      const o = new Option(n, n); if (n === no.valor) o.selected = true; s.add(o);
    }
    if (no.valor == null) s.value = '';
    s.disabled = !no.editavel || !no.rna;
    s.title = no.rotulo || '';
    s.onchange = () => enviar({ cmd: 'escrever', rna: no.rna, valor: s.value || null, indice: null });
    r.append(s);
    const botao = (op, txt, dica, cmd) => {
      if (!op) return;
      const b = el('button', 'btn', txt); b.title = dica + ' (' + op + ')';
      b.onclick = () => enviar(cmd ? cmd(op) : { cmd: 'operador', op, props: {} });
      r.append(b);
    };
    botao(no.op_novo, '+', 'Novo', op => ({ cmd: 'novo_bloco', op, rna: no.rna }));
    botao(no.op_abrir, '\u{1F4C2}', 'Abrir');
    botao(no.op_desvincular, '×', 'Desvincular');
    return r;
  }

  // template_preview: {id:{id_tipo, id}} — imagem virá depois.
  function templatePreview(no) {
    css();
    const d = el('div', 'wt-prev', no.id ? 'Prévia: ' + no.id.id : 'Sem prévia');
    if (no.id) d.dataset.preview = no.id.id_tipo + ':' + no.id.id;
    return d;
  }

  const POR_TIPO = { template_list: templateList, template_ID: templateID, template_preview: templatePreview };

  // Devolve o HTMLElement do nó, ou null se não for um template conhecido / veio sem_suporte.
  function criar(no, enviar) {
    const f = POR_TIPO[no && no.tipo];
    if (!f || no.sem_suporte) return null;
    return f(no, enviar);
  }

  global.WidgetsTemplates = { criar, templateList, templateID, templatePreview };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

// Preferências locais (tamanhos, painéis fechados, abas). localStorage pode faltar: tudo em try/catch.
function lerPref(k, padrao) { try { const v = localStorage.getItem('editorweb.' + k); return v == null ? padrao : JSON.parse(v); } catch (e) { return padrao; } }
function gravarPref(k, v) { try { localStorage.setItem('editorweb.' + k, JSON.stringify(v)); } catch (e) { /* sem storage */ } }

// Console (área de baixo): log das mensagens trocadas com a engine.
const consoleEl = document.getElementById('console');
function log(t, classe) {
  if (!classe) classe = /^✗/.test(t) ? 'erro' : /^✓/.test(t) ? 'ok' : /^→/.test(t) ? 'env' : 'info';
  const d = document.createElement('div'); d.className = classe;
  const h = document.createElement('span'); h.className = 'hora'; h.textContent = new Date().toTimeString().slice(0, 8);
  d.append(h, document.createTextNode(t));
  const noFim = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 8;
  consoleEl.append(d);
  while (consoleEl.childElementCount > 300) consoleEl.firstElementChild.remove();
  if (noFim) consoleEl.scrollTop = consoleEl.scrollHeight;
}

// Estado editado na página (o real seria o le.escrever() no núcleo).
const estado = {};
function chave(rna, i) { return rna ? rna.id_tipo + ':' + rna.id + ':' + rna.caminho + (i == null ? '' : '[' + i + ']') : null; }
// Caminhos que mudam o que outros campos mostram: releem os painéis depois de gravar no núcleo.
const RELER_PAINEIS = new Set(['rotation_mode', 'active_material_index', 'data.type', 'empty_draw_type', 'world']);   // 'world': troca de World da cena
function enviar(no, valor, i) {
  if (nucleo.salvando && !wsAberto()) { log('⚠ aguarde terminar de salvar para editar'); paineisDoAtivo(); return; }
  if (nucleo.aberto && !wsAberto() && no.rna) {
    // arquivo do núcleo: o RNA decide (limites, recusas); a prévia usa o valor relido
    const lido = escreverNoNucleo(no.rna, valor, i);
    if (lido === undefined) { paineisDoAtivo(); return; }   // recusado: painel volta ao valor do arquivo
    log('→ núcleo: ' + no.rna.caminho + (i == null ? '' : '[' + i + ']') + ' = ' + JSON.stringify(lido));
    if (no.rna.caminho === 'rotation_mode') rotacaoDoNucleo(no.rna.id, lido);
    else previaCampo(no.rna, lido, i);
    if (RELER_PAINEIS.has(no.rna.caminho)) paineisDoAtivo();
    return;
  }
  const k = chave(no.rna, i); if (k) estado[k] = valor;
  if (no.rna && wsAberto()) ponte.ws.send(JSON.stringify({ cmd: 'escrever', rna: no.rna, valor, indice: i == null ? null : i }));
  log('→ engine' + (wsAberto() ? '' : ' (offline)') + ': escrever(' + JSON.stringify(no.rna) + ', ' + JSON.stringify(valor) + (i == null ? '' : ', ' + i) + ')');
  previaCampo(no.rna, valor, i);
}

// Ponte ao vivo (tools/editor_web/ponte.py no repo da engine). Por file:// fica offline.
const OPS_PONTE = new Set(['ed.undo', 'ed.redo', 'object.select_all', 'object.location_clear', 'object.rotation_clear', 'object.scale_clear',
  'particle.new', 'palette.new', 'text.new']);
// "+" do seletor que cria e liga ao dono (comando novo_bloco da ponte, com o caminho rna do seletor).
const NOVO_LIGA = new Set(['material.new', 'world.new', 'texture.new']);
const ponte = { ws: null, rev: -1, pendente: null, ocupado: 0, espera: 500 };
// Núcleo wasm (arquivo aberto sem engine): instância, se há arquivo aberto, renomes do Outliner ainda não aplicados.
const nucleo = { promessa: null, modulo: null, aberto: false, nomes: null, salvando: false };
let objetoAtivo = (CENA.find(o => o.ativo) || {}).nome || 'Cube';
let arquivoAberto = null;
function wsAberto() { return !!ponte.ws && ponte.ws.readyState === 1; }
function luz(ok, dica) {
  const l = document.getElementById('luz'); l.classList.add('on'); l.classList.toggle('ok', ok); l.title = dica;
  document.getElementById('conexao-txt').textContent = ok ? 'conectado' : 'reconectando…';
  atualizarMenus();
}
function operadorPonte(op, props) {
  if (!wsAberto() || !OPS_PONTE.has(op)) return false;
  ponte.ws.send(JSON.stringify({ cmd: 'operador', op, props: props || {} }));
  log('→ engine: operador ' + op + (props ? ' ' + JSON.stringify(props) : '')); return true;
}
// Arrasto/digitação em curso: segura a atualização para não recriar o widget na mão do usuário.
function ocupar() { ponte.ocupado++; }
function liberar() {
  ponte.ocupado = Math.max(0, ponte.ocupado - 1);
  if (!ponte.ocupado && ponte.pendente) { const m = ponte.pendente; ponte.pendente = null; aplicar(m); }
}
function aplicar(m) {
  if (ponte.ocupado) { ponte.pendente = m; return; }
  nucleo.aberto = false; nucleo.nomes = null;   // a engine manda na cena daqui em diante
  PAINEIS = m.paineis || {}; objetoAtivo = m.objeto; arquivoAberto = m.arquivo || null; atualizarMenus();
  CENA = m.cena || (m.objetos || []).map(n => ({ nome: n, tipo: '', pai: null, nivel: 0, ativo: n === m.objeto, selecionado: n === m.objeto }));
  for (const k in estado) delete estado[k];
  const rolagem = listaEl.scrollTop; montarAbas(); listaEl.scrollTop = rolagem; montarOutliner(); desenhar();
}
function conectar() {
  const t = new URLSearchParams(location.search).get('t');
  if (location.protocol !== 'http:' || !t) return;
  document.getElementById('sub').textContent = 'ao vivo · edições vão para a engine';
  const ws = ponte.ws = new WebSocket('ws://' + location.host + '/ws?t=' + encodeURIComponent(t));
  ws.onopen = () => { ponte.espera = 500; luz(true, 'conectado'); log('conectado à engine', 'ok'); ws.send(JSON.stringify({ cmd: 'paineis' })); ws.send(JSON.stringify({ cmd: 'malhas' })); };
  ws.onclose = () => {
    luz(false, 'desconectado — tentando de novo'); ponte.ws = null;
    setTimeout(conectar, ponte.espera); ponte.espera = Math.min(8000, ponte.espera * 2);
  };
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.tipo === 'paineis') { if (m.rev > ponte.rev) { ponte.rev = m.rev; aplicar(m); } }
    else if (m.tipo === 'malhas') receberMalhas(m);
    else if (m.tipo === 'transformacoes') receberTransf(m);
    else if (m.tipo === 'erro') log('✗ engine: ' + m.erro);
    else if (m.tipo === 'ok' && m.cmd === 'salvar') log('✓ engine: salvo ' + m.arquivo);
    else if (m.tipo === 'ok' && m.cmd === 'novo_bloco') log('✓ engine: ' + m.bloco + ' criado e ligado');
    else if (m.tipo === 'ok' && m.undo_push !== false) log('✓ engine: ' + m.cmd + (m.valor !== undefined ? ' = ' + JSON.stringify(m.valor) : ''));
  };
}
function valorDe(no, i) {
  const k = chave(no.rna, i);
  if (k in estado) return estado[k];
  return i == null ? no.valor : (no.valor || [])[i];
}

function fmt(v, sub) {
  if (typeof v !== 'number') return String(v);
  const s = Number.isInteger(v) ? String(v) : v.toFixed(3);
  if (sub === 'TRANSLATION' || sub === 'DISTANCE' || sub === 'XYZ' && false) return s + ' m';
  if (sub === 'EULER' || sub === 'ANGLE') return (v * 180 / Math.PI).toFixed(1) + '°';
  if (sub === 'PERCENTAGE' || sub === 'FACTOR' && false) return s + '%';
  return s;
}

function campoNum(no, i, rotulo) {
  const d = document.createElement('div'); d.className = 'num';
  const r = document.createElement('span'); r.className = 'rot'; r.textContent = rotulo || '';
  const v = document.createElement('span');
  const mostra = () => v.textContent = fmt(valorDe(no, i), no.subtipo);
  d.append(r, v); mostra();
  d.title = (no.dica || '') + (no.rna ? '\n' + no.rna.id_tipo + '["' + no.rna.id + '"].' + no.rna.caminho : '');
  const inteiro = no.tipo_rna === 'INT';
  const ang = no.subtipo === 'EULER' || no.subtipo === 'ANGLE';
  d.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    const x0 = ev.clientX, v0 = Number(valorDe(no, i)) || 0; let mexeu = false, ultimo = 0, timer = null;
    d.setPointerCapture(ev.pointerId); ocupar();
    const mandar = () => { timer = null; ultimo = performance.now(); enviar(no, valorDe(no, i), i); };
    const mover = e => {
      const dx = e.clientX - x0; if (Math.abs(dx) > 2) mexeu = true; if (!mexeu) return;
      let passo = inteiro ? 0.1 : (ang ? Math.PI / 180 : 0.01);
      if (e.shiftKey) passo /= 10;
      let nv = v0 + dx * passo;
      if (e.ctrlKey) nv = ang ? Math.round(nv / (Math.PI / 36)) * (Math.PI / 36) : Math.round(nv * (inteiro ? 1 : 10)) / (inteiro ? 1 : 10);
      if (inteiro) nv = Math.round(nv);
      if (no.min != null) nv = Math.max(no.min, Math.min(no.max, nv));
      const k = chave(no.rna, i); if (k) estado[k] = nv; mostra();
      previaCampo(no.rna, nv, i);
      // Throttle de 30 ms durante o arrasto; o envio final vai no soltar.
      if ((wsAberto() || nucleo.aberto) && !timer) timer = setTimeout(mandar, Math.max(0, 30 - (performance.now() - ultimo)));
    };
    const soltar = () => {
      d.removeEventListener('pointermove', mover); d.removeEventListener('pointerup', soltar); d.removeEventListener('pointercancel', soltar);
      if (timer) { clearTimeout(timer); timer = null; }
      if (mexeu) enviar(no, valorDe(no, i), i);
      liberar();
    };
    d.addEventListener('pointercancel', soltar);
    d.addEventListener('pointermove', mover); d.addEventListener('pointerup', soltar);
  });
  d.addEventListener('dblclick', () => {
    const inp = document.createElement('input'); const atual = Number(valorDe(no, i));
    inp.value = ang ? (atual * 180 / Math.PI).toFixed(3) : atual; d.replaceChildren(inp); inp.focus(); inp.select(); ocupar();
    let feito = false;
    const fim = ok => { if (feito) return; feito = true; if (ok) { let n = parseFloat(inp.value); if (!isNaN(n)) { if (ang) n = n * Math.PI / 180; enviar(no, n, i); } }
      d.replaceChildren(r, v); mostra(); liberar(); };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') fim(true); if (e.key === 'Escape') fim(false); });
    inp.addEventListener('blur', () => fim(true));
  });
  return d;
}

const EIXOS = { TRANSLATION: 'XYZ', EULER: 'XYZ', XYZ: 'XYZ', DIRECTION: 'XYZ', QUATERNION: 'WXYZ', AXISANGLE: 'WXYZ',
  COLOR: 'RGBA', COLOR_GAMMA: 'RGBA' };

function prop(no) {
  if (no.erro || !no.tipo_rna) return falta('prop ' + (no.rna ? no.rna.caminho : '?'));
  const semRot = no.text === '';
  const rotulo = no.text != null && no.text !== '' ? no.text : no.rotulo;
  const t = no.tipo_rna;
  if (t === 'BOOLEAN') {
    if (Array.isArray(no.valor)) {
      const r = document.createElement('div'); r.className = 'row';
      const ex = EIXOS[no.subtipo] || (no.valor.length <= 4 ? 'XYZW' : '');
      no.valor.forEach((_, i) => r.append(chk(no, i, ex[i] || String(i))));
      return r;
    }
    if (semRot && no.icon) return toggleIcone(no, ICONES_UI[no.icon] || iconeLetra(no));
    return chk(no, null, semRot ? '' : rotulo);
  }
  if ((t === 'FLOAT' || t === 'INT') && no.tamanho > 0) {
    if (no.subtipo && no.subtipo.startsWith('COLOR')) {
      const inp = document.createElement('input'); inp.type = 'color';
      const c = valorDe(no) || [0, 0, 0];
      inp.value = '#' + c.slice(0, 3).map(x => Math.round(Math.min(1, Math.max(0, x)) * 255).toString(16).padStart(2, '0')).join('');
      inp.style.cssText = 'width:100%;height:20px;border:0;background:none;padding:0';
      inp.oninput = () => enviar(no, [1, 3, 5].map(k => parseInt(inp.value.substr(k, 2), 16) / 255).concat(c.slice(3)));
      return comRotulo(semRot ? '' : rotulo, inp);
    }
    const vet = document.createElement('div'); vet.className = 'vetor';
    const ex = EIXOS[no.subtipo] || '';
    for (let i = 0; i < no.tamanho; i++) vet.append(campoNum(no, i, ex[i] || String(i)));
    const c = document.createElement('div'); c.className = 'column';
    if (!semRot) { const h = document.createElement('div'); h.className = 'cab-prop'; h.textContent = rotulo + ':'; c.append(h); }
    c.append(vet); return c;
  }
  if (t === 'FLOAT' || t === 'INT') return campoNum(no, null, semRot ? '' : rotulo);
  if (t === 'ENUM') {
    const s = document.createElement('select');
    const val = valorDe(no);
    if (no.expand) {
      const r = document.createElement('div'); r.className = 'row';
      (no.opcoes || []).forEach(([id, nome]) => { const b = document.createElement('button'); b.className = 'btn';
        b.textContent = nome; if (id === val || (Array.isArray(val) && val.includes(id))) b.style.background = 'var(--azul)';
        b.onclick = () => { enviar(no, id); b.parentNode.querySelectorAll('.btn').forEach(x => x.style.background = '');
          b.style.background = 'var(--azul)'; }; r.append(b); });
      return comRotulo(semRot ? '' : rotulo, r);
    }
    (no.opcoes || []).forEach(([id, nome]) => { const o = new Option(nome, id); if (id === val) o.selected = true; s.add(o); });
    s.onchange = () => enviar(no, s.value);
    return comRotulo(semRot ? '' : rotulo, s);
  }
  if (t === 'POINTER' && no.opcoes) {
    // ponteiro para ID com candidatos do núcleo: lista com "(nenhum)" = valor vazio
    const sel = document.createElement('select'); const val = valorDe(no) ?? '';
    if (!no.nunca_nulo) sel.add(new Option('(nenhum)', ''));
    no.opcoes.forEach(([id, nome]) => sel.add(new Option(nome, id)));
    if (val && !no.opcoes.some(([id]) => id === val)) sel.add(new Option(val, val));
    sel.value = val;
    sel.onchange = () => enviar(no, sel.value);
    return comRotulo(semRot ? '' : rotulo, sel);
  }
  if (t === 'STRING' || t === 'POINTER') {
    const inp = document.createElement('input'); inp.className = 'texto'; inp.value = valorDe(no) ?? '';
    if (t === 'POINTER') inp.placeholder = '(nenhum)';
    inp.onchange = () => enviar(no, inp.value);
    return comRotulo(semRot ? '' : rotulo, inp);
  }
  if (t === 'COLLECTION') return falta('coleção ' + no.rotulo + ' (' + no.valor + ')');
  return falta(t + ' ' + no.rotulo);
}

function cenaDosObjetos(objs) {
  const nomes = new Set(objs.map(o => o.nome)), filhos = new Map(), raiz = [];
  for (const o of objs) {
    const p = o.pai && nomes.has(o.pai) && o.pai !== o.nome ? o.pai : null;
    if (p) { if (!filhos.has(p)) filhos.set(p, []); filhos.get(p).push(o); } else raiz.push(o);
  }
  const ordem = l => l.slice().sort((a, b) => a.nome.localeCompare(b.nome));
  const out = [], vistos = new Set();
  const descer = (o, nivel, pai) => {
    if (vistos.has(o.nome)) return;
    vistos.add(o.nome);
    out.push({ nome: o.nome, tipo: o.tipo, pai, nivel, ativo: false, selecionado: false });
    for (const f of ordem(filhos.get(o.nome) || [])) descer(f, nivel + 1, o.nome);
  };
  ordem(raiz).forEach(o => descer(o, 0, null));
  for (const o of objs) descer(o, 0, null);   // sobra de ciclo de pais: entra como raiz

    if (CENA[0]) CENA[0].ativo = CENA[0].selecionado = true;
    tlAtualizar();
    paineisDoAtivo();   // painéis da cena anterior saem; entram os do objeto ativo lidos por RNA
    arquivoAberto = arq.name;
    recolhidos.clear(); montarOutliner(); atualizarMenus();
    enquadrar(null);
    log('✓ ' + arq.name + ': ' + m.objetos.length + ' objetos em ' + Math.round(performance.now() - t0) + ' ms', 'ok');

// Salvar sem engine: aplica os renomes do Outliner, grava com BLO_write_file e baixa o arquivo.

async function salvarNucleo(paraJogar) {
  if (nucleo.salvando || !nucleo.modulo) return;

    const pares = [...(nucleo.nomes || [])].filter(([vis, real]) => vis !== real);
    const tmp = pares.map(([vis, real], k) => [vis, ren(real, '\u0001ren' + k + '_' + Date.now())]);
    for (const [vis, t] of tmp) {
      const fim = t && ren(t, vis);
      if (!fim) { log('✗ renomear ' + vis + ': objeto não encontrado no arquivo'); continue; }
      if (fim !== vis) {   // nome já usado por um objeto escondido: o arquivo ficou com outro
        log('⚠ ' + vis + ' foi salvo como ' + fim + ' (nome já existia no arquivo)');
        const c = CENA.find(o => o.nome === vis); if (c) c.nome = fim;
        CENA.forEach(o => { if (o.pai === vis) o.pai = fim; });
        const g = cenaGL.porNome.get(vis); if (g) { cenaGL.porNome.delete(vis); cenaGL.porNome.set(fim, g); g.nome = fim; }

    // gravação recusada antes de escrever (ex.: não abriu o arquivo): a instância continua boa

    try { M.FS.unlink('/salvo.range'); } catch (_) {}

    log('✓ ' + nome + ' salvo (' + (bytes.length / 1048576).toFixed(1) + ' MB) em ' + Math.round(performance.now() - t0) + ' ms', 'ok');

    nucleo.salvando = false;

    if (vez === nucleo.vez && nucleo.aberto && !nucleo.modulo) { nucleo.aberto = false; log('⚠ reabra o arquivo para continuar editando'); }
    atualizarMenus();

  }
}
